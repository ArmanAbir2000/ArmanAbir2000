# Animated contribution snake for your GitHub profile
# File location in your profile repo: .github/workflows/snake.yml
# Generates: output/github-contribution-grid-snake.svg (+ dark variant)
# The README references those SVGs — run this workflow once after adding it.

name: generate snake

on:
  schedule:
    - cron: "0 */6 * * *" # refresh every 6 hours (UTC)
  workflow_dispatch: # allows manual runs from the Actions tab
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: ArmanAbir2000
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
